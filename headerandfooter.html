<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header and Footer</title>
    <link rel="stylesheet" href="headerandfooter.css">
</head>
<body>

    <!-- Header Starts -->
    <header>
        <div class="header">
            <div>
                <h1>My Website</h1>
            </div>

        </div>
    </header>
    <!-- Header Ends -->

    <!-- Main Starts -->
    <div class="main">
        <div class="content">
            <h1>Welcome To My Website</h1>
            <p>
                A Python Full Stack Developer can develop
                both frontend and backend applications using
                HTML, CSS, JavaScript, Python and Django.
            </p>
            <button class="learn">Learn More</button>
        </div>

        <div class="image">
            <img src="images/flowers.jpg" alt="Nature">
        </div>
    </div>
    <!-- Main Ends -->

    <!-- Footer Starts -->
    <footer>
        <div class="footer">

            <div class="footer-about">
                <h2>About Us</h2>
                <p>Welcome to my website.</p>
                <img src="images/nature.jpg" alt="Nature">
            </div>
        </div>
       
    </footer>
    <!-- Footer Ends -->

</body>
</html>
